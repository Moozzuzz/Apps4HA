name: "Mindustry Game Server"
version: 0.1.0.11
slug: mindustry
description: "Mindustry game server with Home Assistant integration."
url: https://github.com/Moozzuzz/Apps4HA/tree/main/Mindustry

arch:
  - aarch64
  - amd64

ports:
  5000/tcp: 5000
  6567/udp: 6567

#map:
#  - addon_config:rw

init: false
startup: services
boot: auto
backup: cold

auth_api: true

options:
  port: 6567
  server_name: "My local mindustry server"
  log_level: "warning"
  max_players: 8
  pvp: false
  strict: false
  auto_restart: true
  restart_hour: 3

schema:
  port: port
  server_name: str
  log_level: str
  max_players: int
  pvp: bool
  strict: bool
  auto_restart: bool
  restart_hour: int(0,23)
