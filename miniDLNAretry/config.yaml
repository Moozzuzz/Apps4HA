name: "TEST miniDLNA for Home Assistant (HA)"
version: 0.0.1b
description: "TEST This app (~addon) provides you with the latest miniDLNA on Alpine..."
slug: minidlna-test
stage: experimental
init: false

url: https://github.com/Moozzuzz/Apps4HA/tree/main/miniDLNAretry
arch:
  - aarch64
  - amd64

ports:
  1900/udp: 1900

map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw

privileged:
  - NET_ADMIN

devices:
  - /dev/net/tun

host_network: true


ingress: true
ingress_port: 9998
# ingress_stream: true
webui: "http://[HOST]:[PORT:9998]"

panel_icon: mdi:dlna
panel_title: miniDLNA

options:
  media_dir: /media;/share
  options: -d
  friendly_name: HA miniDLNA

schema:
  media_dir: str
  options: str
  friendly_name: str
