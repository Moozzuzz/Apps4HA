name: "miniDLNA for Home Assistant (HA)"
version: 0.0.1g
description: "This app (~addon) provides you with the latest miniDLNA on Alpine. miniDLNA is a simple media (audio, pictures & video) server, which aims to be fully compliant with DLNA/UPnP-AV clients."
slug: minidlna

stage: experimental

startup: services
init: false
boot: auto
backup: cold

url: https://github.com/Moozzuzz/Apps4HA/tree/main/miniDLNA
arch:
  - aarch64
  - amd64

ports:
  1900/udp: 1900

map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw

privileged:
  - NET_ADMIN

devices:
  - /dev/net/tun

host_network: true
auth_api: true

#when dis/enabling ingress: check run.sh as well
ingress: true
ingress_port: 9998
ingress_stream: true
webui: http://[HOST]:[PORT:9998]

panel_icon: mdi:dlna
panel_title: miniDLNA

options:
  media_dir: /media
  options: ""
  friendly_name: HA miniDLNA

schema:
  media_dir: str
  options: str
  friendly_name: str
